<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <pattern id="gridP" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1B2739" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>
  <rect width="600" height="340" fill="#0B1120"/>
  <rect width="600" height="340" fill="url(#gridP)"/>

  <circle cx="300" cy="170" r="120" fill="#4D8DF6" opacity="0.06"/>

  <!-- Feature mesh -->
  <g stroke="#8AB4F8" stroke-width="1.5" opacity="0.35">
    <line x1="120" y1="100" x2="220" y2="80"/>
    <line x1="120" y1="100" x2="220" y2="150"/>
    <line x1="120" y1="180" x2="220" y2="150"/>
    <line x1="120" y1="240" x2="220" y2="230"/>
    <line x1="220" y1="80" x2="330" y2="110"/>
    <line x1="220" y1="150" x2="330" y2="110"/>
    <line x1="220" y1="150" x2="330" y2="200"/>
    <line x1="220" y1="230" x2="330" y2="200"/>
    <line x1="330" y1="110" x2="460" y2="140"/>
    <line x1="330" y1="200" x2="460" y2="140"/>
  </g>

  <circle cx="120" cy="100" r="4.5" fill="#6B8FC9"/>
  <circle cx="120" cy="180" r="4.5" fill="#6B8FC9"/>
  <circle cx="120" cy="240" r="4.5" fill="#6B8FC9"/>
  <circle cx="220" cy="80" r="5.5" fill="#4D8DF6"/>
  <circle cx="220" cy="150" r="6.5" fill="#4D8DF6"/>
  <circle cx="220" cy="230" r="5.5" fill="#4D8DF6"/>
  <circle cx="330" cy="110" r="7" fill="#4D8DF6"/>
  <circle cx="330" cy="200" r="7" fill="#4D8DF6"/>

  <!-- Classifier output -->
  <g transform="translate(190, 70)">
    <rect width="220" height="150" rx="10" fill="#101827" stroke="#243044" stroke-width="1.5"/>
    <path d="M0 10a10 10 0 0 1 10-10h200a10 10 0 0 1 10 10v18H0z" fill="#16202F"/>
    <circle cx="16" cy="14" r="3.5" fill="#3A4A64"/>
    <circle cx="28" cy="14" r="3.5" fill="#2F63C9"/>
    <circle cx="40" cy="14" r="3.5" fill="#6BA0F8"/>
    <text x="54" y="18" fill="#B7C0CE" font-family="monospace" font-size="10">nlp_classifier.py</text>

    <text x="18" y="52" fill="#4D8DF6" font-family="monospace" font-size="11">&gt; Extracting TF-IDF...</text>
    <text x="18" y="72" fill="#B7C0CE" font-family="monospace" font-size="10">Features: 4,096 tokens</text>
    <text x="18" y="90" fill="#B7C0CE" font-family="monospace" font-size="10">Model: LogisticRegression</text>

    <rect x="18" y="105" width="184" height="28" rx="6" fill="#132133" stroke="#4D8DF6" stroke-width="1"/>
    <text x="30" y="123" fill="#C9DBFF" font-family="monospace" font-size="10.5" font-weight="bold">PHISHING SCORE: 94.2%</text>
  </g>

  <!-- Method strip -->
  <g transform="translate(140, 260)">
    <rect width="320" height="42" rx="8" fill="#0B1120" stroke="#1B2739" stroke-width="1"/>
    <text x="20" y="26" fill="#8A94A6" font-family="sans-serif" font-size="12">Algorithm: <tspan fill="#8AB4F8" font-weight="600">TF-IDF + LogReg</tspan></text>
    <text x="184" y="26" fill="#8A94A6" font-family="sans-serif" font-size="12">Status: <tspan fill="#8AB4F8" font-weight="600">In progress</tspan></text>
  </g>
</svg>
