<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bgW)"/>
  
  <!-- Burp Suite / HTTP Intercept Terminal -->
  <g transform="translate(60, 45)">
    <rect width="480" height="240" rx="10" fill="#0B1120" stroke="#2F63C9" stroke-width="1.5"/>
    <rect width="480" height="32" rx="10" fill="#1B2739"/>
    <!-- Window controls -->
    <circle cx="20" cy="16" r="5" fill="#3A4A64"/>
    <circle cx="36" cy="16" r="5" fill="#2F63C9"/>
    <circle cx="52" cy="16" r="5" fill="#6BA0F8"/>
    <text x="80" y="20" fill="#B9CDF8" font-family="monospace" font-size="11">BURP SUITE // HTTP PROXY &amp; REPEATER</text>
    
    <!-- Sub-tabs -->
    <g transform="translate(20, 46)">
      <rect width="70" height="20" rx="4" fill="#2F63C9"/>
      <text x="14" y="14" fill="#F5F7FA" font-family="monospace" font-size="10">Target</text>
      <rect x="80" width="70" height="20" rx="4" fill="#243044"/>
      <text x="96" y="14" fill="#D3DFFA" font-family="monospace" font-size="10">Proxy</text>
      <rect x="160" width="80" height="20" rx="4" fill="#243044"/>
      <text x="174" y="14" fill="#D3DFFA" font-family="monospace" font-size="10">Repeater</text>
    </g>
    
    <!-- HTTP Request / Response split view -->
    <g transform="translate(20, 80)">
      <!-- Left side: Request -->
      <rect width="210" height="135" rx="6" fill="#101827" stroke="#243044" stroke-width="1"/>
      <text x="12" y="22" fill="#8AB4F8" font-family="monospace" font-size="10" font-weight="bold">POST /api/v1/user/auth HTTP/1.1</text>
      <text x="12" y="40" fill="#8A94A6" font-family="monospace" font-size="9">Host: training-lab.local</text>
      <text x="12" y="55" fill="#8A94A6" font-family="monospace" font-size="9">Cookie: session=eyJhbGciOi...</text>
      <text x="12" y="70" fill="#8A94A6" font-family="monospace" font-size="9">Content-Type: application/json</text>
      <text x="12" y="95" fill="#8AB4F8" font-family="monospace" font-size="9">{ "id": 105, "role": "admin" }</text>
      <text x="12" y="115" fill="#B9CDF8" font-family="monospace" font-size="8.5">&gt; Testing Broken Access Control</text>
    </g>
    
    <g transform="translate(250, 80)">
      <!-- Right side: Response -->
      <rect width="210" height="135" rx="6" fill="#101827" stroke="#243044" stroke-width="1"/>
      <text x="12" y="22" fill="#6BA0F8" font-family="monospace" font-size="10" font-weight="bold">HTTP/1.1 200 OK</text>
      <text x="12" y="40" fill="#8A94A6" font-family="monospace" font-size="9">X-Frame-Options: SAMEORIGIN</text>
      <text x="12" y="55" fill="#8A94A6" font-family="monospace" font-size="9">Content-Type: application/json</text>
      <text x="12" y="80" fill="#8AB4F8" font-family="monospace" font-size="9">// Lab Evidence Captured</text>
      <text x="12" y="100" fill="#B7C0CE" font-family="monospace" font-size="9">OWASP Top 10 Practice</text>
      <text x="12" y="118" fill="#B9CDF8" font-family="monospace" font-size="8.5">Remediation: Role Auth Verification</text>
    </g>
  </g>
</svg>
