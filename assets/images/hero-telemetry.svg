<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4D8DF6"/>
      <stop offset="50%" stop-color="#8AB4F8"/>
      <stop offset="100%" stop-color="#2F63C9"/>
    </linearGradient>
    <filter id="cyberGlowMain" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="250" cy="250" r="160" fill="#2F63C9" opacity="0.12" filter="url(#cyberGlowMain)"/>

  <!-- Rotating Ring 1 (Target scope) -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="#6BA0F8" stroke-width="1.2" stroke-dasharray="8 12" opacity="0.3"/>
  <circle cx="250" cy="250" r="150" fill="none" stroke="#4D8DF6" stroke-width="1.5" stroke-dasharray="14 8 2 8" opacity="0.5"/>
  <circle cx="250" cy="250" r="110" fill="none" stroke="#8AB4F8" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Orbital Node points -->
  <circle cx="250" cy="60" r="5" fill="#4D8DF6" filter="url(#cyberGlowMain)"/>
  <circle cx="440" cy="250" r="5" fill="#8AB4F8"/>
  <circle cx="250" cy="440" r="4" fill="#2F63C9"/>
  <circle cx="60" cy="250" r="5" fill="#4D8DF6"/>

  <!-- Central Cyber Shield Core -->
  <path d="M250 140 L330 180 V260 C330 325 250 370 250 370 C250 370 170 325 170 260 V180 Z" fill="#101827" stroke="url(#shieldGradMain)" stroke-width="3.5" filter="url(#cyberGlowMain)"/>

  <!-- Internal Shield Geometry -->
  <path d="M250 160 L310 195 V255 C310 305 250 345 250 345 C250 345 190 305 190 255 V195 Z" fill="#0B1120" stroke="#2F63C9" stroke-width="1.5" opacity="0.8"/>

  <!-- Keyhole / Terminal Lock Symbol -->
  <circle cx="250" cy="235" r="18" fill="#4D8DF6" opacity="0.9"/>
  <path d="M241 245 L237 280 H263 L259 245 Z" fill="#4D8DF6" opacity="0.9"/>
  <circle cx="250" cy="235" r="7" fill="#0B1120"/>

  <!-- Floating Telemetry Badges -->
  <!-- Badge 1: Port Scan -->
  <g transform="translate(40, 110)">
    <rect width="130" height="42" rx="8" fill="#0B1120" stroke="#2F63C9" stroke-width="1" opacity="0.95"/>
    <circle cx="16" cy="21" r="4" fill="#14B8A6"/>
    <text x="28" y="18" fill="#B7C0CE" font-family="monospace" font-size="9">TARGET_SCOPE</text>
    <text x="28" y="32" fill="#8AB4F8" font-family="monospace" font-size="10" font-weight="bold">Authorized Lab</text>
  </g>

  <!-- Badge 2: Integrity -->
  <g transform="translate(330, 310)">
    <rect width="135" height="42" rx="8" fill="#0B1120" stroke="#4D8DF6" stroke-width="1" opacity="0.95"/>
    <circle cx="16" cy="21" r="4" fill="#4D8DF6"/>
    <text x="28" y="18" fill="#B7C0CE" font-family="monospace" font-size="9">DEFENSE_POSTURE</text>
    <text x="28" y="32" fill="#14B8A6" font-family="monospace" font-size="10" font-weight="bold">Continuous Learn</text>
  </g>
</svg>
